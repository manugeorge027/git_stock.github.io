name: Update stock data

on:
  schedule:
    # Every 30 minutes, Mon-Fri, 04:00-10:59 UTC (about 9:30 am - 4:30 pm IST)
    - cron: "*/30 4-10 * * 1-5"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance

      - run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --staged --quiet || (git commit -m "Update stock data" && git push)
